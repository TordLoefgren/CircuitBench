<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircuitBench</title>
  </head>

  <body>
    <div class="app-shell">
      <header class="app-shell__header app-header">
        <hgroup class="app-header__heading">
          <h1 class="app-header__title">Circuit Bench</h1>
          <p class="app-header__subtitle">
            Build and simulate simple circuits.
          </p>
        </hgroup>
      </header>

      <main class="app-shell__main">
        <div class="workspace">
          <aside class="panel inspector">
            <h2 class="panel__title inspector__title">Inspector</h2>

            <section
              class="inspector__section"
              aria-labelledby="circuit-information-title"
            >
              <h3
                id="circuit-information-title"
                class="inspector__section-title"
              >
                Circuit information
              </h3>

              <dl class="inspector__values">
                <dt>Source voltage</dt>
                <dd id="source-voltage"></dd>
                <dt>Components</dt>
                <dd id="component-count"></dd>
              </dl>

              <ol id="inspector-components" class="inspector__components"></ol>
            </section>

            <section
              class="inspector__section"
              aria-labelledby="simulation-result-title"
            >
              <h3 id="simulation-result-title" class="inspector__section-title">
                Simulation result
              </h3>

              <p id="simulation-status" class="inspector__status" role="status">
                Click Simulate to see the results.
              </p>

              <div id="simulation-result" hidden></div>
            </section>
          </aside>

          <section class="panel bench">
            <header class="bench__header">
              <h2 class="panel__title bench__title">Circuit</h2>

              <button class="button" id="simulate-button" type="button">
                Simulate
              </button>
            </header>

            <div class="bench__area">
              <div class="bench__circuit-row">
                <div class="bench__circuit-row">
                  <div class="terminal terminal--source">9 V</div>

                  <div id="circuit-components" class="bench__components"></div>

                  <div class="terminal terminal--ground">GND</div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer class="app-shell__footer"></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
