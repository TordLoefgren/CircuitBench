<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircuitBench</title>
  </head>

  <body>
    <div class="app-shell">
      <header class="app-shell__header app-header">
        <hgroup class="app-header__heading">
          <h1 class="app-header__title">Circuit Bench</h1>
          <p class="app-header__subtitle">
            Build and simulate simple circuits.
          </p>
        </hgroup>
      </header>

      <main class="app-shell__main">
        <div class="workspace">
          <aside class="panel inspector">
            <h2 class="panel__title inspector__title">Inspector</h2>

            <section id="circuit-information" class="inspector__section">
              <h3 class="inspector__section-title">Circuit information</h3>

              <div id="source-voltage"></div>
              <dl class="inspector__values">
                <dt>Components</dt>
                <dd id="component-count"></dd>
              </dl>

              <ul id="inspector-components" class="inspector__components"></ul>
              <div class="inspector__component-actions">
                <button class="button" id="add-resistor-button" type="button">
                  Add Resistor
                </button>
                <button class="button" id="add-led-button" type="button">
                  Add LED
                </button>
                <button
                  class="button button--secondary inspector__clear-button"
                  id="clear-components-button"
                  type="button"
                >
                  Clear components
                </button>
              </div>
            </section>

            <section class="inspector__section">
              <h3 class="inspector__section-title">Simulation result</h3>

              <p id="simulation-status" class="inspector__status">
                Click Simulate to see the results.
              </p>

              <div id="simulation-result" hidden></div>
            </section>
          </aside>

          <section class="panel bench">
            <header class="bench__header">
              <h2 class="panel__title bench__title">Circuit</h2>

              <button class="button" id="simulate-button" type="button">
                Simulate
              </button>
            </header>

            <div class="bench__area">
              <div class="bench__circuit-row">
                <div class="bench__circuit-row">
                  <div
                    id="source-terminal"
                    class="terminal terminal--source"
                  ></div>

                  <div id="circuit-components" class="bench__components"></div>

                  <div class="terminal terminal--ground">GND</div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer class="app-shell__footer"></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
