<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircuitBench</title>
  </head>
  <body>
    <div id="app-shell">
      <header class="app-header">
        <h1 class="app-header__title">CircuitBench</h1>
        <p class="app-header__subtitle">
          This is where the circuit simulation happens!
        </p>
      </header>

      <main class="app-main">
        <section class="circuit-simulation">
          <input
            class="circuit-simulation__button"
            id="circuit-simulation__button"
            type="button"
            value="Simulate"
          />

          <output
            class="circuit-simulation__output"
            id="circuit-simulation__output"
          ></output>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
